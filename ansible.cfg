[defaults]
# Базовые параметры Kubespray
force_valid_group_names = ignore
host_key_checking = False
timeout = 30
deprecation_warnings = False
display_skipped_hosts = no

# Сбор и кэширование фактов
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp
fact_caching_timeout = 86400

# Плагины, колбэки и роли
stdout_callback = default
callbacks_enabled = profile_tasks,ara_default
library = ./library
roles_path = roles:$VIRTUAL_ENV/usr/local/share/kubespray/roles:$VIRTUAL_ENV/usr/local/share/ansible/roles:/usr/share/kubespray/roles

# Игнорируемые файлы
inventory_ignore_extensions = ~, .orig, .bak, .ini, .cfg, .retry, .pyc, .pyo, .creds, .gpg

[inventory]
ignore_patterns = artifacts, credentials

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=30m -o ConnectionAttempts=100 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null