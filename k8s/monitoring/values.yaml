# Настройки Grafana
grafana:
  enabled: true
  adminPassword: "prom-operator"
  
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.51.250.89.49.nip.io
    paths:
      - /
    pathType: Prefix

  # Ресурсы для основного контейнера Grafana
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

  # Ресурсы для вспомогательных sidecar-контейнеров
  sidecar:
    dashboards:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 150m
          memory: 256Mi
    datasources:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 150m
          memory: 256Mi

# Настройки Prometheus
prometheus:
  prometheusSpec:
    retention: 2d
    resources:
      requests:
        cpu: 150m
        memory: 512Mi
      limits:
        cpu: 300m
        memory: 1024Mi

# Настройки Alertmanager
alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

# Системный сборщик метрик хостов (node-exporter)
nodeExporter:
  enabled: true