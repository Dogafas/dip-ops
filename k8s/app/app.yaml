apiVersion: apps/v1
kind: Deployment
metadata:
  name: dip-app
  namespace: default
  labels:
    app: dip-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dip-app
  template:
    metadata:
      labels:
        app: dip-app
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: dip-app
          image: datadynamo/dip-app:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: dip-app-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: dip-app
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dip-app-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: app.130.193.50.58.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dip-app-service
                port:
                  number: 80
